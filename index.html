<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الوسائط</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,Arial,sans-serif}
  body{background:#fafafa;color:#1a1a1a;min-height:100vh}

  header{
    background:#fff;border-bottom:1px solid #e5e5e5;
    padding:18px 24px;
  }
  header h1{font-size:1.1rem;font-weight:600}

  main{max-width:900px;margin:0 auto;padding:24px}

  .back{
    display:none;align-items:center;gap:6px;
    background:none;border:1px solid #ddd;border-radius:8px;
    padding:8px 16px;font-size:.85rem;cursor:pointer;margin-bottom:18px;
    color:#1a1a1a;font-family:inherit;transition:.15s;
  }
  .back:hover{background:#f0f0f0}
  .back.show{display:inline-flex}

  .path{color:#999;font-size:.82rem;margin-bottom:14px}

  .list{display:flex;flex-direction:column;background:#fff;
    border:1px solid #e5e5e5;border-radius:12px;overflow:hidden}

  .item{
    display:flex;align-items:center;gap:14px;
    padding:15px 20px;cursor:pointer;transition:background .15s;
    border-bottom:1px solid #f0f0f0;
  }
  .item:last-child{border-bottom:none}
  .item:hover{background:#f7f7f7}

  .item-icon{
    width:40px;height:40px;border-radius:10px;flex-shrink:0;
    background:#f0f0f0;display:flex;align-items:center;justify-content:center;font-size:1.2rem;
  }
  .item-name{font-size:.92rem;font-weight:500;word-break:break-all}
  .item-meta{color:#999;font-size:.76rem;margin-top:2px}
  .item-arrow{margin-right:auto;color:#bbb;font-size:.85rem}

  .empty{padding:50px;text-align:center;color:#999;font-size:.9rem}
  .error{padding:50px;text-align:center;color:#c00;font-size:.9rem}

  .modal{
    display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);
    z-index:100;align-items:center;justify-content:center;padding:16px;
  }
  .modal.open{display:flex}
  .modal-box{
    background:#111;border-radius:14px;width:100%;max-width:900px;height:88vh;
    display:flex;flex-direction:column;overflow:hidden;
  }
  .modal-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:13px 18px;border-bottom:1px solid #222;flex-shrink:0;
  }
  .modal-head h3{font-size:.85rem;color:#eee;font-weight:500;word-break:break-all}
  .close-btn{
    background:#222;border:none;color:#aaa;width:30px;height:30px;
    border-radius:8px;font-size:.9rem;cursor:pointer;line-height:1;flex-shrink:0;
  }
  .close-btn:hover{color:#fff}
  .modal-body{flex:1;overflow:auto;background:#000;display:flex;
    align-items:center;justify-content:center}
  .modal-body img{max-width:100%;max-height:100%;object-fit:contain}
  .modal-body video{width:100%;height:100%}
  .modal-body audio{width:85%;max-width:480px}
  .modal-body iframe{width:100%;height:100%;border:none;background:#fff}

  @media(max-width:560px){
    main{padding:16px}
    header{padding:15px 16px}
  }
</style>
</head>
<body>

<header><h1>الوسائط</h1></header>

<main>
  <button class="back" id="backBtn">→ رجوع</button>
  <div class="path" id="path"></div>
  <div class="list" id="list">
    <div class="empty">جاري التحميل...</div>
  </div>
</main>

<div class="modal" id="modal">
  <div class="modal-box">
    <div class="modal-head">
      <h3 id="modal-title"></h3>
      <button class="close-btn" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script>
/* ═══ الإعدادات ═══ */
const GITHUB_USER = "mf0xc";
const GITHUB_REPO = "drive";
const FOLDER      = "files";
const BRANCH      = "main";
/* ═══════════════ */

const list    = document.getElementById('list');
const pathEl  = document.getElementById('path');
const backBtn = document.getElementById('backBtn');
let currentPath = FOLDER;
let historyStack = [];

const TYPES = {
  video:{ext:['mp4','webm','mov','mkv','m4v'],icon:'🎬'},
  audio:{ext:['mp3','wav','ogg','m4a','flac'],icon:'🎵'},
  image:{ext:['jpg','jpeg','png','gif','webp','svg'],icon:'🖼️'},
  pdf:  {ext:['pdf'],icon:'📕'}
};

function getType(name){
  const ext = name.split('.').pop().toLowerCase();
  for(const [k,t] of Object.entries(TYPES))
    if(t.ext.includes(ext)) return {key:k,...t};
  return null;
}

function formatSize(b){
  if(b === 0) return '0 بايت';
  const k = 1024, s = ['بايت','كيلوبايت','ميجابايت','جيجابايت'];
  const i = Math.floor(Math.log(b)/Math.log(k));
  return (b/Math.pow(k,i)).toFixed(1) + ' ' + s[i];
}

function rawUrl(filePath){
  return "https://githubusercontent.com" + GITHUB_USER + "/" + GITHUB_REPO + "/" + BRANCH + "/" + filePath.split('/').map(encodeURIComponent).join('/');
}

async function loadDir(dir){
  list.innerHTML = '<div class="empty">جاري التحميل...</div>';
  try{
    // تم إصلاح تركيب الرابط البرمجي هنا ليتصل بالـ API بشكل سليم تماماً دون تشويه الرموز
    const url = "https://github.com" + GITHUB_USER + "/" + GITHUB_REPO + "/contents/" + dir + "?ref=" + BRANCH;
    const res = await fetch(url);
    if(!res.ok) throw new Error('تعذر الوصول إلى المجلد');
    const data = await res.json();

    const folders = data.filter(f => f.type === 'dir');
    const files   = data.filter(f => f.type === 'file');
    files.sort((a,b) => a.name.localeCompare(b.name,'ar'));
    folders.sort((a,b) => a.name.localeCompare(b.name,'ar'));

    pathEl.textContent = dir === FOLDER ? '' : '📁 ' + dir.split('/').slice(1).join(' / ');
    backBtn.classList.toggle('show', dir !== FOLDER);

    if(folders.length === 0 && files.length === 0){
      list.innerHTML = '<div class="empty">هذا المجلد فارغ</div>';
      return;
    }

    let html = '';
    folders.forEach(f => {
      html += `
        <div class="item" onclick="openDir('${f.path.replace(/'/g,"\'")}')">
          <div class="item-icon">📁</div>
          <div>
            <div class="item-name">${f.name}</div>
          </div>
          <span class="item-arrow">←</span>
        </div>`;
    });
    files.forEach(f => {
      const t = getType(f.name);
      const icon = t ? t.icon : '📄';
      html += `
        <div class="item" onclick="openFile('${f.path.replace(/'/g,"\'")}')">
          <div class="item-icon">${icon}</div>
          <div>
            <div class="item-name">${f.name}</div>
            <div class="item-meta">${formatSize(f.size)}</div>
          </div>
        </div>`;
    });
    list.innerHTML = html;
  }catch(err){
    list.innerHTML = '<div class="error">تعذر تحميل المحتوى — تحقق من الإعدادات</div>';
  }
}

function openDir(dir){
  historyStack.push(currentPath);
  currentPath = dir;
  loadDir(dir);
}

backBtn.addEventListener('click', () => {
  currentPath = historyStack.pop() || FOLDER;
  loadDir(currentPath);
});

function openFile(filePath){
  const name = filePath.split('/').pop();
  const t = getType(name);
  const raw = rawUrl(filePath);
  const body = document.getElementById('modal-body');
  document.getElementById('modal-title').textContent = name;

  if(t && t.key === 'video'){
    body.innerHTML = `<video src="${raw}" controls autoplay playsinline></video>`;
  }else if(t && t.key === 'audio'){
    body.innerHTML = `<audio src="${raw}" controls autoplay></audio>`;
  }else if(t && t.key === 'image'){
    body.innerHTML = `<img src="${raw}" alt="${name}">`;
  }else if(t && t.key === 'pdf'){
    body.innerHTML = `<iframe src="https://google.com" + encodeURIComponent(raw) + "&embedded=true"></iframe>`;
  }else{
    return;
  }
  document.getElementById('modal').classList.add('open');
}

function closeModal(){
  document.getElementById('modal').classList.remove('open');
  document.getElementById('modal-body').innerHTML = '';
}
document.getElementById('modal').addEventListener('click', e => {
  if(e.target.id === 'modal') closeModal();
});
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeModal(); });

loadDir(currentPath);
</script>

</body>
</html>
